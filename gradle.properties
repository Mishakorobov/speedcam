org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Enabled once ./gradlew build was green. ktlint and detekt both support the
# configuration cache; it removes the per-invocation configuration phase, which is a
# meaningful share of wall-clock time on a 7-module build.
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official
